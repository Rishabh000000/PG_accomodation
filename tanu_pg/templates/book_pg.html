<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book PG</title>
    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
        }

        /* Container for the whole page */
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #4CAF50;
            margin-top: 50px;
        }

        /* Form container */
        .form-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        label {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            color: #555;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus, select:focus, button:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Hover effects */
        input:hover, select:hover {
            border-color: #4CAF50;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
                margin: 30px auto;
                max-width: 90%;
            }

            label, input, select, button {
                font-size: 14px;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Book a PG</h2>
        <div class="form-container">
            <form method="POST">
                <label for="name">Your Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="contact">Contact Number:</label><br>
                <input type="text" id="contact" name="contact" required><br><br>

                <label for="pg_id">Select PG:</label><br>
                <select name="pg_id" id="pg_id" required>
                    {% for pg_id, pg_name in pg_options %}
                        <option value="{{ pg_id }}">{{ pg_id }} - {{ pg_name }}</option>
                    {% endfor %}
                </select><br><br>

                <button type="submit">Book PG</button>
            </form>
        </div>
    </div>
</body>
</html>
