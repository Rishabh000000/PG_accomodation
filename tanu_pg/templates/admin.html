<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            color: #4CAF50;
        }

        /* Navigation styles */
        nav {
            background-color: #333;
            padding: 10px 0;
            text-align: center;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            display: inline-block;
            margin: 0 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* Hover effects for links */
        nav ul li a:hover {
            background-color: #4CAF50;
            color: white;
            transform: scale(1.1);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            nav ul li {
                display: block;
                margin: 10px 0;
            }

            nav ul li a {
                font-size: 16px;
                padding: 8px 15px;
            }
        }

    </style>
</head>
<body>
    <h2>Admin Panel</h2>
    <nav>
        <ul>
            <li><a href="{{ url_for('view_pgs') }}">View PGs</a></li>
            <li><a href="{{ url_for('register_pg') }}">Register New PG</a></li>
            <li><a href="{{ url_for('booking_history') }}">View Bookings</a></li>
            <li><a href="{{ url_for('export_csv') }}">Export PG Data (CSV)</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </nav>
</body>
</html>
